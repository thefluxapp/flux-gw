[package]
name = "flux-gw"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
flux-users-api = { git = "https://github.com/thefluxapp/flux-users.git" }
flux-messages-api = { git = "https://github.com/thefluxapp/flux-messages.git" }
flux-notify-api = { git = "https://github.com/thefluxapp/flux-notify.git" }
flux-lib = { git = "https://github.com/thefluxapp/flux-lib.git" }

thiserror = "2.0.14"
config = { version = "0.15", default-features = false, features = ["toml"] }
uuid = { version = "1.18.0", features = ["serde", "v7"] }
jsonwebtoken = "9.3.1"
tracing = { version = "0.1.41", features = ["log"] }

axum = { version = "0.8.4", features = ["ws"] }
axum-extra = { version = "0.10.1", features = ["typed-header"] }

async-nats = "0.42.0"

tokio = { version = "1.47.1", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }

prost = "0.14.1"
tonic = { version = "0.14.1", default-features = false, features = ["channel"] }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
serde_with = { version = "3.14.0", features = ["base64"] }
